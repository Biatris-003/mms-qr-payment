<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#166534">
<title>MMS Academy Payment System</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#f0fdf4,#f8fafc);color:#1f2937
}
.container{width:100%;max-width:620px;margin:auto;padding:20px}
.header{
  background:linear-gradient(135deg,#166534,#14532d);color:white;
  padding:28px 20px;border-radius:22px;text-align:center;
  box-shadow:0 8px 25px rgba(20,83,45,.20);margin-bottom:18px
}
.logo{font-size:42px;margin-bottom:5px}
.header h1{margin:0;font-size:28px}
.header p{margin:8px 0 0;opacity:.9}
.card{
  background:white;padding:20px;border-radius:20px;margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.06)
}
label{display:block;font-weight:700;margin-bottom:7px}
input,select,textarea{
  width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;
  font-size:16px;margin-bottom:15px;outline:none;font-family:inherit
}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#166534}
button{
  width:100%;padding:16px;border:none;border-radius:13px;font-size:17px;
  font-weight:700;cursor:pointer;transition:.15s ease
}
button:active{transform:scale(.98)}
.start{background:#166534;color:white}
.stop{background:#dc2626;color:white;display:none;margin-top:10px}
.record{background:#15803d;color:white}
.record:disabled{background:#94a3b8;cursor:not-allowed}
#reader{width:100%;margin-top:18px;overflow:hidden;border-radius:16px}
.status{
  display:none;padding:15px;border-radius:13px;margin-top:15px;
  text-align:center;font-weight:700;line-height:1.5
}
.status.info{display:block;background:#dcfce7;color:#166534}
.status.success{display:block;background:#dcfce7;color:#166534}
.status.warning{display:block;background:#fef3c7;color:#92400e}
.status.error{display:block;background:#fee2e2;color:#991b1b}
.student{display:none;text-align:center}
.student-icon{font-size:55px}
.student-name{color:#166534;font-size:27px;font-weight:800;margin-top:8px}
.student-info{color:#64748b;margin-top:7px}
.payment-section{display:none}
.amount-row{
  background:#f0fdf4;border:1px solid #bbf7d0;border-radius:15px;
  padding:15px;margin-bottom:15px
}
.amount-label{font-size:13px;color:#166534;font-weight:700}
.remaining{
  background:#f8fafc;border-radius:12px;padding:12px;margin:4px 0 15px;
  text-align:center;font-weight:700
}
.small{text-align:center;color:#64748b;font-size:13px;margin-top:10px}
.footer{text-align:center;color:#94a3b8;font-size:12px;padding-bottom:20px}
.divider{text-align:center;color:#94a3b8;margin:18px 0}
</style>
</head>

<body>
<div class="container">

<div class="header">
  <div class="logo">💰</div>
  <h1>MMS ACADEMY</h1>
  <p>Payment System</p>
</div>

<div class="card">
  <label>Received By</label>
  <input id="receivedBy" type="text" placeholder="Enter teacher/cashier name" autocomplete="name">

  <button id="startButton" class="start" onclick="startScanner()">📷 START PAYMENT SCANNING</button>
  <button id="stopButton" class="stop" onclick="stopScanner()">⛔ STOP SCANNING</button>

  <div id="reader"></div>
  <div id="status" class="status"></div>

  <div class="small">Scan the student's QR code to load their payment information.</div>
</div>

<div id="studentCard" class="card student">
  <div class="student-icon">👨‍🎓</div>
  <div id="studentName" class="student-name"></div>
  <div id="studentId" class="student-info"></div>
  <div id="studentLevel" class="student-info"></div>
</div>

<div id="paymentSection" class="card payment-section">

  <div class="amount-row">
    <div class="amount-label">MONTHLY FEE</div>
    <div id="monthlyFeeDisplay" style="font-size:24px;font-weight:800;margin-top:5px">0 EGP</div>
  </div>

  <label>Month</label>
  <select id="paymentMonth"></select>

  <label>Amount to Pay (EGP)</label>
  <input id="amount" type="number" min="0" step="0.01" placeholder="Enter amount">

  <div id="paymentSummary" class="remaining">
    Checking previous payments...
  </div>

  <label>Payment Method</label>
  <select id="paymentMethod">
    <option value="Cash">Cash</option>
    <option value="Bank Transfer">Bank Transfer</option>
    <option value="Card">Card</option>
    <option value="Other">Other</option>
  </select>

  <label>Notes (Optional)</label>
  <textarea id="notes" placeholder="Optional payment notes"></textarea>

  <button id="recordButton" class="record" onclick="recordPayment()">💰 RECORD PAYMENT</button>
  <div class="small">The amount is automatically suggested from the student's monthly fee, but you can change it.</div>
</div>

<div class="footer">MMS Academy • Payment System</div>

</div>

<script>
const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbyln4OWZ0v3seqETGN7rDJel1ngK5wY6G5A6oBsSRjzFWOlQYPVcSHVcwck25YZ4LPMQw/exec";

const APP_TOKEN =
  "MMS-QR-2026-Cairo-7Kx9P2vL4nQ8-ATTD-6Fz3R";

let scanner = null;
let scannerRunning = false;
let currentStudent = null;
let processingScan = false;
let checkingPayments = false;

document.addEventListener("DOMContentLoaded", function() {
  const savedTeacher = localStorage.getItem("mms_payment_received_by");
  if (savedTeacher) document.getElementById("receivedBy").value = savedTeacher;

  document.getElementById("receivedBy").addEventListener("input", function() {
    localStorage.setItem("mms_payment_received_by", this.value);
  });

  populateMonths();
});

function populateMonths() {
  const select = document.getElementById("paymentMonth");
  const now = new Date();
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth();

  select.innerHTML = "";

  for (let offset = -2; offset <= 6; offset++) {
    const d = new Date(currentYear, currentMonth + offset, 1);
    const value =
      String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();

    const option = document.createElement("option");
    option.value = value;
    option.textContent = d.toLocaleString("en-US", {
      month: "long",
      year: "numeric"
    });

    if (offset === 0) option.selected = true;
    select.appendChild(option);
  }

  select.addEventListener("change", function() {
    if (currentStudent) loadPaymentSummary(currentStudent.id, this.value);
  });
}

async function startScanner() {
  if (scannerRunning) return;

  if (!window.isSecureContext) {
    showStatus(
      "error",
      "❌ Camera access requires HTTPS.<br><br>Open the GitHub Pages HTTPS URL, not a local file."
    );
    return;
  }

  clearStatus();

  try {
    showStatus("info", "📷 Requesting camera permission...");

    scanner = new Html5Qrcode("reader");

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.7777778
      },
      onScanSuccess,
      onScanFailure
    );

    scannerRunning = true;
    document.getElementById("startButton").style.display = "none";
    document.getElementById("stopButton").style.display = "block";

    showStatus("info", "📷 Camera ready. Point it at the student's QR code.");
  } catch (error) {
    console.error("Camera error:", error);

    scannerRunning = false;
    document.getElementById("startButton").style.display = "block";
    document.getElementById("stopButton").style.display = "none";

    showStatus("error", "❌ Could not access the camera.<br><br>" + String(error.message || error));
  }
}

async function stopScanner() {
  if (!scanner) return;

  try {
    if (scannerRunning) await scanner.stop();
  } catch (error) {
    console.error(error);
  }

  try {
    await scanner.clear();
  } catch (error) {
    console.error(error);
  }

  scanner = null;
  scannerRunning = false;

  document.getElementById("startButton").style.display = "block";
  document.getElementById("stopButton").style.display = "none";
}

async function onScanSuccess(decodedText) {
  if (processingScan) return;

  processingScan = true;

  const studentId = String(decodedText || "").trim();
  console.log("QR SCANNED:", studentId);

  await stopScanner();

  if (!studentId) {
    processingScan = false;
    showStatus("error", "❌ QR code is empty.");
    return;
  }

  findStudentForPayment(studentId);
}

function onScanFailure(errorMessage) {
  // Normal QR misses are ignored.
}

function findStudentForPayment(studentId) {
  showStatus("info", "⏳ Finding student...");

  jsonpRequest(
    "find",
    { studentId: studentId },
    function(response) {
      if (!response || !response.success) {
        processingScan = false;
        showStatus(
          "error",
          "❌ " + ((response && response.message) || "Student not found.")
        );
        return;
      }

      currentStudent = response.student;

      displayStudent(currentStudent);

      const monthlyFee = Number(currentStudent.monthlyFee) || 0;

      document.getElementById("monthlyFeeDisplay").textContent =
        formatMoney(monthlyFee) + " EGP";

      document.getElementById("amount").value =
        monthlyFee > 0 ? monthlyFee : "";

      document.getElementById("paymentSection").style.display = "block";

      processingScan = false;

      loadPaymentSummary(
        currentStudent.id,
        document.getElementById("paymentMonth").value
      );

      showStatus(
        "success",
        "🟢 Student found. Payment details are ready."
      );
    }
  );
}

function loadPaymentSummary(studentId, month) {
  checkingPayments = true;
  document.getElementById("recordButton").disabled = true;
  document.getElementById("paymentSummary").textContent =
    "Checking previous payments...";

  jsonpRequest(
    "paymentSummary",
    {
      studentId: studentId,
      month: month
    },
    function(response) {
      checkingPayments = false;

      if (!response || !response.success) {
        document.getElementById("paymentSummary").textContent =
          "Could not check previous payments.";

        document.getElementById("recordButton").disabled = false;
        return;
      }

      const fee = Number(currentStudent.monthlyFee) || 0;
      const paid = Number(response.totalPaid) || 0;
      const remaining = Math.max(0, fee - paid);

      if (fee > 0) {
        document.getElementById("paymentSummary").innerHTML =
          "Paid so far: <strong>" + formatMoney(paid) +
          " EGP</strong><br>Remaining: <strong>" +
          formatMoney(remaining) + " EGP</strong>";
      } else {
        document.getElementById("paymentSummary").innerHTML =
          "Paid so far: <strong>" + formatMoney(paid) + " EGP</strong>";
      }

      if (fee > 0 && remaining > 0) {
        document.getElementById("amount").value = remaining;
      } else if (fee > 0 && remaining === 0) {
        document.getElementById("amount").value = "";
        showStatus(
          "warning",
          "⚠️ This student has already paid the full monthly fee for " + month + "."
        );
      }

      document.getElementById("recordButton").disabled = false;
    }
  );
}

function recordPayment() {
  if (!currentStudent) {
    showStatus("error", "❌ Scan a student QR code first.");
    return;
  }

  const amount = Number(document.getElementById("amount").value);
  const paymentMethod = document.getElementById("paymentMethod").value;
  const month = document.getElementById("paymentMonth").value;
  const receivedBy =
    document.getElementById("receivedBy").value.trim() || "Teacher";
  const notes = document.getElementById("notes").value.trim();

  if (!amount || amount <= 0) {
    showStatus("error", "❌ Enter a valid payment amount.");
    return;
  }

  const button = document.getElementById("recordButton");
  button.disabled = true;

  showStatus("info", "⏳ Recording payment...");

  jsonpRequest(
    "payment",
    {
      studentId: currentStudent.id,
      amount: amount,
      paymentMethod: paymentMethod,
      month: month,
      receivedBy: receivedBy,
      notes: notes
    },
    function(response) {
      button.disabled = false;

      if (!response || !response.success) {
        showStatus(
          "error",
          "❌ " + ((response && response.message) || "Payment could not be recorded.")
        );
        return;
      }

      showStatus(
        "success",
        "🟢 PAYMENT RECORDED<br>" +
        currentStudent.name +
        "<br>" +
        formatMoney(amount) +
        " EGP • " +
        month +
        "<br>Payment ID: " +
        response.paymentId
      );

      loadPaymentSummary(currentStudent.id, month);
      document.getElementById("notes").value = "";
    }
  );
}

function displayStudent(student) {
  document.getElementById("studentCard").style.display = "block";
  document.getElementById("studentName").textContent = student.name || "";
  document.getElementById("studentId").textContent =
    "Student ID: " + (student.id || "");
  document.getElementById("studentLevel").textContent =
    "Level: " + (student.level || "");
}

function formatMoney(value) {
  return Number(value || 0).toLocaleString("en-US", {
    maximumFractionDigits: 2
  });
}

function jsonpRequest(action, params, callback) {
  const callbackName =
    "mmsPaymentCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);

  let script = null;

  window[callbackName] = function(data) {
    try {
      callback(data);
    } finally {
      delete window[callbackName];

      if (script && script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }
  };

  const query = new URLSearchParams();

  query.set("action", action);
  query.set("token", APP_TOKEN);
  query.set("callback", callbackName);

  Object.keys(params || {}).forEach(function(key) {
    query.set(key, params[key]);
  });

  script = document.createElement("script");

  script.src = BACKEND_URL + "?" + query.toString();

  script.onerror = function() {
    delete window[callbackName];

    if (script && script.parentNode) {
      script.parentNode.removeChild(script);
    }

    showStatus("error", "❌ Could not connect to MMS backend.");
  };

  document.body.appendChild(script);
}

function showStatus(type, message) {
  const status = document.getElementById("status");
  status.className = "status " + type;
  status.innerHTML = message;
  status.style.display = "block";
}

function clearStatus() {
  const status = document.getElementById("status");
  status.style.display = "none";
  status.innerHTML = "";
}
</script>
</body>
</html>
