<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2563eb">

<title>Mrs. Helpees Abdelnour Garas - Payments</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#eff6ff,#f8fafc);
  color:#1f2937;
}

.container{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:18px;
}

.header{
  background:linear-gradient(135deg,#2563eb,#1e3a8a);
  color:white;
  padding:28px 20px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 10px 30px rgba(30,58,138,.18);
  margin-bottom:18px;
}

.logo{
  font-size:44px
}

.header h1{
  margin:0;
  font-size:27px
}

.header p{
  margin:8px 0 0;
  opacity:.9
}

.card{
  background:white;
  padding:20px;
  border-radius:20px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:13px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.start{
  background:#2563eb;
  color:white;
}

.stop{
  background:#dc2626;
  color:white;
  display:none;
  margin-top:10px;
}

.find{
  background:#1e3a8a;
  color:white;
}

.save{
  background:#16a34a;
  color:white;
  margin-top:18px;
}

#reader{
  width:100%;
  margin-top:16px;
  overflow:hidden;
  border-radius:16px;
}

.status{
  display:none;
  padding:14px;
  border-radius:13px;
  margin-top:14px;
  text-align:center;
  font-weight:700;
  line-height:1.5;
}

.status.info{
  display:block;
  background:#dbeafe;
  color:#1e40af;
}

.status.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:18px 0;
  color:#94a3b8;
  font-weight:800;
}

.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:#e5e7eb;
}

label{
  display:block;
  font-weight:800;
  margin-bottom:7px;
}

input,
select,
textarea{
  width:100%;
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:12px;
  font-size:16px;
  margin-bottom:12px;
  font-family:inherit;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.student-name{
  text-align:center;
  font-size:28px;
  font-weight:900;
  color:#1d4ed8;
}

.student-meta{
  text-align:center;
  color:#64748b;
  margin-top:5px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:18px;
}

.stat{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:16px;
  padding:15px;
  text-align:center;
}

.stat-label{
  font-size:12px;
  color:#64748b;
  font-weight:800;
}

.stat-value{
  font-size:21px;
  font-weight:900;
  color:#1e3a8a;
  margin-top:6px;
}

.paid{
  color:#166534 !important;
}

.remaining{
  color:#b45309 !important;
}

.section-title{
  font-size:21px;
  font-weight:900;
  margin-bottom:14px;
}

.hidden{
  display:none;
}

.small{
  text-align:center;
  color:#64748b;
  font-size:13px;
  margin-top:10px;
}

.footer{
  text-align:center;
  color:#94a3b8;
  font-size:12px;
  padding-bottom:20px;
}

@media(max-width:480px){

  .stats{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">💳</div>

    <h1>Mrs. Helpees Abdelnoour Garas</h1>

    <p>Payment Management</p>

  </div>


  <!-- FIND STUDENT -->

  <div class="card">

    <button
      id="startButton"
      class="start"
      onclick="startScanner()"
    >
      📷 SCAN STUDENT QR
    </button>


    <button
      id="stopButton"
      class="stop"
      onclick="stopScanner()"
    >
      ⛔ STOP SCANNING
    </button>


    <div id="reader"></div>


    <div class="divider">
      OR
    </div>


    <label>
      Enter Student ID
    </label>

    <input
      id="manualId"
      placeholder="Example: HAG-302"
      autocomplete="off"
    >


    <button
      class="find"
      onclick="findById()"
    >
      🔎 FIND STUDENT
    </button>


    <div
      id="status"
      class="status"
    ></div>

  </div>


  <!-- STUDENT -->

  <div
    id="studentCard"
    class="card hidden"
  >

    <div
      id="studentName"
      class="student-name"
    ></div>

    <div
      id="studentLevel"
      class="student-meta"
    ></div>

    <div
      id="studentId"
      class="student-meta"
    ></div>


    <div class="stats">

      <div class="stat">

        <div class="stat-label">
          MONTHLY FEE
        </div>

        <div
          id="monthlyFee"
          class="stat-value"
        ></div>

      </div>


      <div class="stat">

        <div class="stat-label">
          PAID SO FAR
        </div>

        <div
          id="paidSoFar"
          class="stat-value paid"
        ></div>

      </div>


      <div class="stat">

        <div class="stat-label">
          LAST PAYMENT
        </div>

        <div
          id="lastPayment"
          class="stat-value"
          style="font-size:16px"
        ></div>

      </div>


      <div class="stat">

        <div class="stat-label">
          CURRENT MONTH PAID
        </div>

        <div
          id="currentMonthPaid"
          class="stat-value"
          style="font-size:16px"
        ></div>

      </div>

    </div>

  </div>


  <!-- PAYMENT -->

  <div
    id="paymentCard"
    class="card hidden"
  >

    <div class="section-title">
      💰 Record Payment
    </div>


    <label>
      Amount Paid
    </label>

    <input
      id="amount"
      type="number"
      min="1"
      step="0.01"
      placeholder="Enter amount"
    >


    <label>
      Payment Method
    </label>

    <select id="paymentMethod">

      <option value="Cash">
        Cash
      </option>

      <option value="Instapay">
        Instapay
      </option>
      
    </select>


    <label>
      Payment Month
    </label>

    <input
      id="month"
      placeholder="Example: 08/2026"
    >


    <label>
      Received By
    </label>

    <input
      id="receivedBy"
      placeholder="Teacher / Staff name"
    >


    <label>
      Notes
    </label>

    <textarea
      id="notes"
      placeholder="Optional payment notes"
    ></textarea>


    <button
      class="save"
      onclick="savePayment()"
    >
      💾 SAVE PAYMENT
    </button>

  </div>


  <div class="footer">
    Mrs. Helpees Abdelnour Garas • Payment Management
  </div>

</div>


<script>

const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbxG3uW7K4FfxlW7fME9J-IMYXzicbnaMCua74FRP9QMSkuY41IenAFwO_PJ4voTPG_xQQ/exec";


const APP_TOKEN =
  "MMS-QR-2026-Cairo-7Kx9P2vL4nQ8-ATTD-6Fz3R";


let scanner = null;

let scannerRunning = false;

let processingScan = false;

let currentStudent = null;


/* =========================================================
   SCANNER
   ========================================================= */

async function startScanner(){

  if(scannerRunning){
    return;
  }


  if(!window.isSecureContext){

    showStatus(
      "error",
      "❌ Camera access requires HTTPS."
    );

    return;
  }


  try{

    showStatus(
      "info",
      "📷 Requesting camera permission..."
    );


    scanner =
      new Html5Qrcode(
        "reader"
      );


    const cameras =
      await Html5Qrcode.getCameras();


    if(
      !cameras ||
      !cameras.length
    ){

      throw new Error(
        "No camera was found."
      );
    }


    let selected =
      cameras[0];


    const preferred =
      cameras.find(
        function(c){

          const label =
            String(
              c.label || ""
            ).toLowerCase();


          return (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment")
          );
        }
      );


    if(preferred){
      selected = preferred;
    }


    await scanner.start(

      selected.id,

      {
        fps:10,

        qrbox:{
          width:250,
          height:250
        },

        aspectRatio:1.7777778
      },

      onScanSuccess,

      function(){}
    );


    scannerRunning = true;


    document
      .getElementById(
        "startButton"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "stopButton"
      )
      .style.display =
        "block";


    showStatus(
      "info",
      "📷 Camera ready. Point it at the student's QR code."
    );


  }catch(error){

    console.error(error);


    showStatus(
      "error",
      "❌ Could not access the camera.<br><br>" +
      String(
        error.message || error
      )
    );
  }
}


async function stopScanner(){

  if(!scanner){
    return;
  }


  try{

    if(scannerRunning){
      await scanner.stop();
    }

  }catch(e){}


  try{
    await scanner.clear();
  }catch(e){}


  scanner = null;

  scannerRunning = false;


  document
    .getElementById(
      "startButton"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "stopButton"
    )
    .style.display =
      "none";
}


async function onScanSuccess(
  decodedText
){

  if(processingScan){
    return;
  }


  processingScan = true;


  await stopScanner();


  loadStudent(
    String(
      decodedText || ""
    ).trim()
  );
}


/* =========================================================
   MANUAL ID
   ========================================================= */

function findById(){

  const id =
    document
      .getElementById(
        "manualId"
      )
      .value
      .trim();


  loadStudent(id);
}


/* =========================================================
   LOAD STUDENT
   ========================================================= */

function loadStudent(
  studentId
){

  studentId =
    String(
      studentId || ""
    ).trim();


  if(!studentId){

    showStatus(
      "error",
      "❌ Enter a Student ID or scan a QR code."
    );

    processingScan = false;

    return;
  }


  showStatus(
    "info",
    "⏳ Loading payment information..."
  );


  /*
   * First find the student.
   */

  jsonpRequest(

    "find",

    {
      studentId:
        studentId
    },

    function(response){

      if(
        !response ||
        !response.success
      ){

        processingScan = false;


        showStatus(
          "error",
          "❌ " +
          (
            response &&
            response.message
              ? response.message
              : "Student not found."
          )
        );

        return;
      }


      currentStudent =
        response.student;


      renderStudent(
        response.student
      );


      /*
       * Now ask the backend to
       * SUM ALL PAYMENTS.
       */

      loadPaymentSummary(
        response.student.id
      );
    }
  );
}


/* =========================================================
   PAYMENT SUMMARY
   ========================================================= */

function loadPaymentSummary(
  studentId
){

  /*
   * Use the current month only
   * for the optional currentMonthPaid
   * calculation.
   */

  const now =
    new Date();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(2,"0") +
    "/" +
    now.getFullYear();


  jsonpRequest(

    "paymentsummary",

    {

      studentId:
        studentId,

      month:
        month
    },

    function(response){

      processingScan = false;


      if(
        !response ||
        !response.success
      ){

        showStatus(
          "error",
          "❌ Could not load payment history."
        );

        return;
      }


      /*
       * THIS is the important value.
       *
       * totalPaid comes from ALL
       * matching Payment tab rows.
       */

      document
        .getElementById(
          "paidSoFar"
        )
        .textContent =
          formatMoney(
            response.totalPaid
          ) +
          " EGP";


      document
        .getElementById(
          "currentMonthPaid"
        )
        .textContent =
          formatMoney(
            response.currentMonthPaid
          ) +
          " EGP";


      document
        .getElementById(
          "lastPayment"
        )
        .textContent =
          response.student.lastPayment ||
          "No payment yet";


      document
        .getElementById(
          "paymentCard"
        )
        .classList
        .remove("hidden");


      showStatus(
        "success",
        "✅ Student payment information loaded."
      );
    }
  );
}


/* =========================================================
   RENDER STUDENT
   ========================================================= */

function renderStudent(
  student
){

  document
    .getElementById(
      "studentCard"
    )
    .classList
    .remove("hidden");


  document
    .getElementById(
      "studentName"
    )
    .textContent =
      student.name || "";


  document
    .getElementById(
      "studentLevel"
    )
    .textContent =
      "Level: " +
      (
        student.level || "—"
      );


  document
    .getElementById(
      "studentId"
    )
    .textContent =
      "Student ID: " +
      student.id;


  document
    .getElementById(
      "monthlyFee"
    )
    .textContent =
      formatMoney(
        student.monthlyFee
      ) +
      " EGP";


  document
    .getElementById(
      "lastPayment"
    )
    .textContent =
      student.lastPayment ||
      "No payment yet";
}


/* =========================================================
   SAVE PAYMENT
   ========================================================= */

function savePayment(){

  if(!currentStudent){

    showStatus(
      "error",
      "❌ Please select a student first."
    );

    return;
  }


  const amount =
    document
      .getElementById(
        "amount"
      )
      .value;


  const paymentMethod =
    document
      .getElementById(
        "paymentMethod"
      )
      .value;


  const month =
    document
      .getElementById(
        "month"
      )
      .value
      .trim();


  const receivedBy =
    document
      .getElementById(
        "receivedBy"
      )
      .value
      .trim();


  const notes =
    document
      .getElementById(
        "notes"
      )
      .value
      .trim();


  if(
    !amount ||
    Number(amount) <= 0
  ){

    showStatus(
      "error",
      "❌ Enter a valid payment amount."
    );

    return;
  }


  if(!month){

    showStatus(
      "error",
      "❌ Enter the payment month."
    );

    return;
  }


  showStatus(
    "info",
    "⏳ Saving payment..."
  );


  jsonpRequest(

    "payment",

    {

      studentId:
        currentStudent.id,

      amount:
        amount,

      paymentMethod:
        paymentMethod,

      month:
        month,

      receivedBy:
        receivedBy,

      notes:
        notes
    },

    function(response){

      if(
        !response ||
        !response.success
      ){

        showStatus(
          "error",
          "❌ " +
          (
            response &&
            response.message
              ? response.message
              : "Could not save payment."
          )
        );

        return;
      }


      /*
       * Backend returns the NEW
       * total paid from ALL payments.
       */

      document
        .getElementById(
          "paidSoFar"
        )
        .textContent =
          formatMoney(
            response.totalPaid
          ) +
          " EGP";


      document
        .getElementById(
          "lastPayment"
        )
        .textContent =
          response.paymentDate;


      /*
       * Clear fields.
       */

      document
        .getElementById(
          "amount"
        )
        .value = "";


      document
        .getElementById(
          "notes"
        )
        .value = "";


      showStatus(
        "success",
        "✅ Payment saved successfully.<br>" +
        "Total paid so far: " +
        formatMoney(
          response.totalPaid
        ) +
        " EGP"
      );
    }
  );
}


/* =========================================================
   JSONP
   ========================================================= */

function jsonpRequest(
  action,
  params,
  callback
){

  const callbackName =
    "hagPaymentCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement(
      "script"
    );


  window[callbackName] =
    function(data){

      try{

        callback(data);

      }finally{

        delete window[
          callbackName
        ];


        if(
          script &&
          script.parentNode
        ){

          script.parentNode
            .removeChild(
              script
            );
        }
      }
    };


  const query =
    new URLSearchParams();


  query.set(
    "action",
    action
  );


  query.set(
    "token",
    APP_TOKEN
  );


  query.set(
    "callback",
    callbackName
  );


  Object.keys(
    params || {}
  ).forEach(
    function(key){

      query.set(
        key,
        params[key]
      );
    }
  );


  script.src =
    BACKEND_URL +
    "?" +
    query.toString();


  script.onerror =
    function(){

      delete window[
        callbackName
      ];


      if(
        script.parentNode
      ){

        script.parentNode
          .removeChild(
            script
          );
      }


      processingScan = false;


      showStatus(
        "error",
        "❌ Could not connect to HAG backend."
      );
    };


  document.body.appendChild(
    script
  );
}


/* =========================================================
   HELPERS
   ========================================================= */

function formatMoney(
  value
){

  return Number(
    value || 0
  ).toLocaleString(
    "en-US",
    {
      maximumFractionDigits:2
    }
  );
}


function showStatus(
  type,
  message
){

  const el =
    document.getElementById(
      "status"
    );


  el.className =
    "status " +
    type;


  el.innerHTML =
    message;


  el.style.display =
    "block";
}

</script>

</body>
</html>
